# S2 - Baseline classifier (real data only)

data:
  size: 64            # MedMNIST+ resolution
  root: data          # downloaded by data/download.py (not committed)
  batch_size: 128

model:
  channels: [32, 64, 128, 256]
  dropout: 0.3

train:
  epochs: 20
  lr: 0.001
  weight_decay: 0.0001
  seeds: [0, 1, 2]
  # none       : plain cross-entropy (the reference baseline)
  # weighted   : cross-entropy weighted by inverse class frequency
  # oversample : rare classes drawn more often by the sampler
  strategies: [none, weighted, oversample]
  select_on: val_macro_f1   # best epoch chosen on the validation set

rare_class: 3          # dermatofibroma (df)
